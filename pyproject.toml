[project]
name = "mensis"
version = "0.1.0"
description = "Notes and tools for taking apart the PS4 Bloodborne: package, executable and data formats"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jeff Nyman" }]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",   # pkgtool.py: AES-CBC, AES-XTS for the PKG/PFS layers
    "pyelftools>=0.31",   # ELF inspection while surveying executables
    "capstone>=5",        # ad-hoc disassembly while surveying executables
    "pillow>=10",         # textures.py: decoding block-compressed (BC1-BC7) textures to PNG
    "numpy>=1.24",        # flver.py: the software renderer for model pictures
]

[dependency-groups]
dev = [
    "ruff>=0.17",         # lint and format: ruff check tools / ruff format tools
    "pyright>=1.1",       # type check (what Pylance runs): pyright tools
]

# The tools are run as scripts (python -I tools/<tool>.py ...), not installed as a package.
[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
# The tools import each other as siblings (sys.path gets tools/ at run time).
extraPaths = ["tools"]
include = ["tools"]
